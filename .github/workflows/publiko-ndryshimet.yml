# Rrjeta e sigurisë e publikimit.
#
# Pse ekziston: më 4 shtator klienti shtoi dy produkte nga CMS-ja. Përmbajtja
# ishte krejt e rregullt — build-i i saj kalon, fotot përpunohen — por Netlify
# nuk nisi asnjë ndërtim për 70 minuta. Sapo u shtyva një commit nga terminali,
# e njëjta përmbajtje doli online për 30 sekonda. Pra commit-et që Sveltia CMS
# bën përmes GitHub API-t nuk e nisnin dot publikimin.
#
# Kjo nis ndërtimin vetë, pa u varur nga lidhja GitHub→Netlify:
#
#   push      — menjëherë, nëse GitHub-i e nxjerr ngjarjen për commit-et e CMS-së
#   schedule  — çdo dy orë, si rrjetë sigurie nëse `push` nuk vjen
#
# Dy shkaqe, jo një, sepse ende nuk dihet nëse `push` vjen për commit-et që
# bëhen përmes API-t. Nëse vjen, publikimi është i menjëhershëm dhe kroni nuk
# gjen kurrë punë. Nëse nuk vjen, kroni e kap brenda dy orësh. Vetë historiku
# i nisjeve te skeda "Actions" e tregon cili nga të dy po punon.
#
# Kroni mbahet i rrallë me qëllim: repo-ja është private dhe GitHub-i jep 2000
# minuta falas në muaj, ndërsa çdo nisje faturohet së paku një minutë. Një kron
# çdo 10 minuta do të hante ~4300 minuta.
#
# ─────────────────────────────────────────────────────────────────────────────
# NDIHMOJE NJËHERË, PASTAJ HARROJE (2 minuta, bëhet vetëm një herë):
#
#   1. Netlify → Site configuration → Build & deploy → Build hooks
#      → "Add build hook", emri "GitHub", dega "main" → Save.
#      Të jep një adresë që fillon me https://api.netlify.com/build_hooks/
#
#   2. GitHub → repo-ja → Settings → Secrets and variables → Actions
#      → "New repository secret"
#      Name:   NETLIFY_BUILD_HOOK
#      Secret: ngjite atë adresë
#
# Adresa është vetëm një çelës që nis ndërtime — nuk jep asnjë të drejtë mbi
# llogarinë. Mos e shkruaj drejt e në këtë file; te Secrets rri e fshehur.
# ─────────────────────────────────────────────────────────────────────────────

name: Publiko ndryshimet e CMS-së

on:
  push:
    branches: [main]
    # Etiketa `i-publikuar` lëviz nga vetë ky workflow; pa këtë do të nisej
    # përsëri nga puna e vet.
    tags-ignore: ['**']
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Dy nisje njëkohësisht do të nisnin dy ndërtime për të njëjtin ndryshim.
concurrency:
  group: publikimi
  cancel-in-progress: false

jobs:
  publiko:
    runs-on: ubuntu-latest
    steps:
      # Pa `checkout`: gjithçka lexohet me API. Nisja zgjat sekonda, jo minuta,
      # dhe repo-ja me fotot brenda nuk shkarkohet fare.
      - name: A ka ndryshuar `main` që nga publikimi i fundit?
        id: kontrolli
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TANI=$(gh api "repos/$REPO/commits/main" --jq .sha)
          I_FUNDIT=$(gh api "repos/$REPO/git/ref/tags/i-publikuar" --jq .object.sha 2>/dev/null || echo "")

          echo "commit-i tani      : $TANI"
          echo "i publikuar më parë: ${I_FUNDIT:-(asnjë)}"

          if [ "$I_FUNDIT" = "$TANI" ]; then
            echo "ndrysho=jo" >> "$GITHUB_OUTPUT"
            echo "Asgjë e re. Nuk nisim ndërtim." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ndrysho=po" >> "$GITHUB_OUTPUT"
            echo "sha=$TANI" >> "$GITHUB_OUTPUT"
          fi

      - name: Nis ndërtimin te Netlify
        id: nisja
        if: steps.kontrolli.outputs.ndrysho == 'po'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          set -uo pipefail

          if [ -z "${HOOK:-}" ]; then
            # Me qëllim nuk dështon: kroni nis shpesh, dhe një dështim i
            # përsëritur do të mbushte postën me njoftime. Paralajmërimi mbetet
            # i dukshëm te përmbledhja e nisjes.
            {
              echo "## Mungon secret-i NETLIFY_BUILD_HOOK"
              echo ""
              echo "Publikimi automatik nuk është aktiv ende. Deri sa të vihet,"
              echo "ndryshimet e klientit nga CMS-ja mund të mos dalin online."
              echo ""
              echo "Udhëzimet janë në krye të .github/workflows/publiko-ndryshimet.yml"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Mungon NETLIFY_BUILD_HOOK — publikimi automatik joaktiv."
            echo "u_nis=jo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KODI=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK" || echo "000")
          echo "Netlify u përgjigj me: $KODI"

          case "$KODI" in
            2*)
              echo "u_nis=po" >> "$GITHUB_OUTPUT"
              echo "Ndërtimi u nis për ${{ steps.kontrolli.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Netlify nuk e pranoi kërkesën (kodi $KODI)."
              echo "u_nis=jo" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

      # Etiketa lëviz vetëm pasi Netlify e pranoi. Nëse hapi i mësipërm dështoi
      # ose secret-i mungon, ajo mbetet aty ku ishte dhe nisja tjetër riprovon.
      - name: Shëno commit-in si të publikuar
        if: steps.nisja.outputs.u_nis == 'po'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.kontrolli.outputs.sha }}
        run: |
          set -uo pipefail
          gh api -X PATCH "repos/$REPO/git/refs/tags/i-publikuar" \
            -f sha="$SHA" -F force=true >/dev/null 2>&1 \
          || gh api -X POST "repos/$REPO/git/refs" \
            -f ref=refs/tags/i-publikuar -f sha="$SHA" >/dev/null
          echo "Etiketa `i-publikuar` u vendos te $SHA"
