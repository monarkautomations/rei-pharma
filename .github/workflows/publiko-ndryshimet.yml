# Rrjeta e sigurisë e publikimit.
#
# Pse ekziston: më 4 shtator klienti shtoi dy produkte nga CMS-ja. Përmbajtja
# ishte krejt e rregullt — build-i i saj kalon, fotot përpunohen — por Netlify
# nuk nisi asnjë ndërtim për 70 minuta. Sapo shtyva unë një commit, i njëjti
# përmbajtje doli online për 30 sekonda. Pra ndërtimi nuk ishte problemi:
# commit-et që CMS-ja bën përmes GitHub API-t nuk e nisnin dot publikimin.
#
# Kjo orë nuk varet nga ajo lidhje. Çdo 10 minuta shikon nëse `main` ka
# ndryshuar që nga publikimi i fundit dhe, po pati, e nis vetë ndërtimin.
# Klienti nuk ka pse të presë e as të shkruajë askund.
#
# ─────────────────────────────────────────────────────────────────────────────
# NDIHMOJE NJËHERË, PASTAJ HARROJE (2 minuta, bëhet vetëm një herë):
#
#   1. Netlify → Site configuration → Build & deploy → Build hooks
#      → "Add build hook", vëri emrin "GitHub cron", dega "main" → Save.
#      Do të të japë një adresë që fillon me https://api.netlify.com/build_hooks/
#
#   2. GitHub → repo-ja → Settings → Secrets and variables → Actions
#      → "New repository secret"
#      Name:   NETLIFY_BUILD_HOOK
#      Secret: ngjite atë adresë
#
# Adresa është vetëm një çelës që nis ndërtime — nuk jep asnjë të drejtë mbi
# llogarinë. Mos e shkruaj drejt e në këtë file; te Secrets rri e fshehur.
# ─────────────────────────────────────────────────────────────────────────────

name: Publiko ndryshimet e CMS-së

on:
  schedule:
    # Çdo 10 minuta. GitHub-i mund ta vonojë disa minuta kur është i ngarkuar.
    - cron: '*/10 * * * *'
  # Që ta nisësh me dorë nga skeda "Actions" kur të duash.
  workflow_dispatch:

# Nevojitet vetëm për të lëvizur etiketën që mban shenjën e publikimit të fundit.
permissions:
  contents: write

# Dy nisje njëkohësisht do të nisnin dy ndërtime për të njëjtin ndryshim.
concurrency:
  group: publikimi
  cancel-in-progress: false

jobs:
  kontrollo:
    runs-on: ubuntu-latest
    steps:
      - name: Merr repo-në me etiketat
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A ka ndryshuar `main` që nga publikimi i fundit?
        id: kontrolli
        run: |
          # Etiketa `i-publikuar` mban commit-in e fundit që e kemi dërguar për
          # ndërtim. Pa të (hera e parë), trajtohet si ndryshim.
          I_FUNDIT=$(git rev-parse --verify --quiet refs/tags/i-publikuar || echo "")
          TANI=$(git rev-parse HEAD)

          echo "commit-i tani     : $TANI"
          echo "i publikuar më parë: ${I_FUNDIT:-(asnjë)}"

          if [ "$I_FUNDIT" = "$TANI" ]; then
            echo "ndrysho=jo" >> "$GITHUB_OUTPUT"
            echo "Asgjë e re. Nuk nisim ndërtim."
          else
            echo "ndrysho=po" >> "$GITHUB_OUTPUT"
            echo "sha=$TANI" >> "$GITHUB_OUTPUT"
          fi

      - name: Nis ndërtimin te Netlify
        if: steps.kontrolli.outputs.ndrysho == 'po'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Mungon secret-i NETLIFY_BUILD_HOOK."
            echo "Shih udhëzimet në krye të këtij file. Pa të, publikimi mbetet"
            echo "i varur nga lidhja GitHub→Netlify, e cila ka dështuar më parë."
            exit 1
          fi

          KODI=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK")
          echo "Netlify u përgjigj me: $KODI"

          # 2xx do të thotë që ndërtimi u vu në radhë.
          case "$KODI" in
            2*) echo "Ndërtimi u nis." ;;
            *)  echo "::error::Netlify nuk e pranoi kërkesën (kodi $KODI)."
                echo "Etiketa nuk lëviz, që provohet sërish pas 10 minutash."
                exit 1 ;;
          esac

      - name: Shëno commit-in si të publikuar
        if: steps.kontrolli.outputs.ndrysho == 'po'
        run: |
          # Lëviz etiketën vetëm pasi Netlify e pranoi. Nëse hapi i mësipërm
          # dështon, etiketa mbetet aty ku ishte dhe nisja e ardhshme riprovon.
          git tag -f i-publikuar "${{ steps.kontrolli.outputs.sha }}"
          git push -f origin refs/tags/i-publikuar
